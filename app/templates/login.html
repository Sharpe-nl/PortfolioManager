<!DOCTYPE html>
<html lang="nl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ t(request, 'auth.login_page_title') }}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/vendor/pico.min.css">
  <link rel="stylesheet" href="/static/style.css">
  <script>(function(){ var t=localStorage.getItem('pm-theme')||'dark'; document.documentElement.setAttribute('data-theme',t); })();</script>
</head>
<body class="auth-page">
<main class="auth-card">
  <h1>PortfolioManager</h1>
  <h2>{{ t(request, 'auth.login_heading') }}</h2>
  <p>{{ t(request, 'auth.login_instructions') }}</p>

  <div id="status" class="status-msg" hidden></div>

  <button id="login-btn" onclick="doLogin()">
    {{ t(request, 'auth.login_button') }}
  </button>
</main>

<script src="/static/app.js"></script>
<script>
const I18N = {
  httpsRequired: {{ t(request, 'auth.https_required_html') | tojson }},
  connecting: {{ t(request, 'auth.connecting') | tojson }},
  touchKey: {{ t(request, 'auth.touch_key') | tojson }},
  loginSuccess: {{ t(request, 'auth.login_success') | tojson }},
  errorPrefix: {{ t(request, 'auth.error_prefix') | tojson }},
};
async function doLogin() {
  const btn = document.getElementById('login-btn');
  const status = document.getElementById('status');
  btn.disabled = true;
  status.hidden = false;

  // WebAuthn vereist een secure context (HTTPS of localhost)
  if (!window.isSecureContext || !navigator.credentials) {
    status.className = 'status-msg error';
    status.innerHTML = I18N.httpsRequired;
    btn.disabled = false;
    return;
  }

  status.textContent = I18N.connecting;

  try {
    // 1 – Get options
    const optResp = await fetch('/auth/login/options', { method: 'POST' });
    if (!optResp.ok) throw new Error(await optResp.text());
    const opts = await optResp.json();

    // 2 – Convert base64url
    opts.challenge = b64ToBuffer(opts.challenge);
    if (opts.allowCredentials) {
      opts.allowCredentials = opts.allowCredentials.map(c => ({
        ...c, id: b64ToBuffer(c.id)
      }));
    }

    status.textContent = I18N.touchKey;

    // 3 – Get assertion
    const cred = await navigator.credentials.get({ publicKey: opts });

    // 4 – Serialize
    const credJson = JSON.stringify({
      id:       cred.id,
      rawId:    bufferToB64(cred.rawId),
      type:     cred.type,
      response: {
        authenticatorData: bufferToB64(cred.response.authenticatorData),
        clientDataJSON:    bufferToB64(cred.response.clientDataJSON),
        signature:         bufferToB64(cred.response.signature),
        userHandle: cred.response.userHandle
          ? bufferToB64(cred.response.userHandle) : null,
      }
    });

    // 5 – Verify
    const verResp = await fetch('/auth/login/verify', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    credJson,
    });
    if (!verResp.ok) throw new Error(await verResp.text());

    status.textContent = I18N.loginSuccess;
    window.location.href = '/';

  } catch (err) {
    status.textContent = I18N.errorPrefix + err.message;
    btn.disabled = false;
  }
}
</script>
</body>
</html>
