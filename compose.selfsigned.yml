services:
  portfoliomanager:
    build: .
    image: portfoliomanager:latest
    restart: unless-stopped
    ports:
      - "8443:8000"
    environment:
      PM_HTTPS_ONLY: "true"
    volumes:
      - /srv/portfoliomanager/data:/app/data
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --ssl-keyfile
      - /app/data/tls/server.key
      - --ssl-certfile
      - /app/data/tls/server.crt
